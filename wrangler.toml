name = "dishadira-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The console's self-hosted fonts (src/fonts.ts) are bundled as bytes. Inherited by the test and live environments.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

# Placeholder id: the real D1 database is created by Rohit, not in a coding session.
[[d1_databases]]
binding = "DB"
database_name = "dishadira-bot"
database_id = "00000000-0000-0000-0000-000000000000"

# Logs and traces in the Cloudflare dashboard. The code logs only route, status, event type and error codes (test/logging.test.ts).
[observability]
enabled = true

[triggers]
# One cron per Worker (the Workers Free plan allows 5 per account). Every 2 minutes: payment reconciliation, outcomes, refunds,
# the heartbeat, and the once-a-day 6:30 pm IST reminders and 9 pm IST digest (src/index.ts, runDailyJobs).
crons = ["*/2 * * * *"]

# Runtime flags at safe defaults. Only Rohit changes these, outside a coding session.
[vars]
OWNER_APPROVED = "false"
NEW_BOOKINGS = "false"
SENDS = "false"
AI_REPLIES = "false"
CONSOLE_V2 = "false" # the role-based console under /app (ticket 19); test may be "true", live stays "false" until Rohit switches over
SOCIAL_REPLIES = "false" # ticket 32: automatic Instagram / Messenger replies (src/social.ts, docs/SOCIAL.md); Rohit turns it on
PAYMENT_MODE = "test"
CHAT_RETENTION_MINUTES = "10080" # chat text is wiped this many minutes after a person's last message (7 days)

# Email to Rohit (digest and alerts). The address itself is the secret DIGEST_TO; no resource is created by this binding.
[[send_email]]
name = "EMAIL"

# ---- Deployment environments (Ticket 08) ----
# `wrangler deploy --env test` / `--env live` (done by the "Deploy" GitHub workflow). The top level above is only for local
# checks and the CI dry run. Test and live have their OWN D1 database and Worker, so their data never mixes.
# Wrangler does not inherit bindings, vars or triggers into an environment, so each one repeats them.
# The database_id values are placeholders: Rohit pastes the real ids (docs/GO-LIVE.md, step 1). All safety flags start off.

[env.test]
name = "dishadira-bot-test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "dishadira-bot-test"
database_id = "75c61d91-e1b4-43ce-a0a7-29fcbd2966b9"
migrations_dir = "migrations"

[env.test.triggers]
crons = ["*/2 * * * *"]

[env.test.observability]
enabled = true

[env.test.vars]
OWNER_APPROVED = "false"
NEW_BOOKINGS = "true"
SENDS = "true"
AI_REPLIES = "true" # the assistant answers typed questions on the test number (Rohit, 22 Oct 2026); live stays "false"
CONSOLE_V2 = "true" # ticket 25: the new console on the test bot; /admin and /amma redirect to /app. "false" brings the old pages back
SOCIAL_REPLIES = "false" # ticket 32: Instagram / Messenger replies; the Page is connected to the live bot only (docs/SOCIAL.md)
PAYMENT_MODE = "test"
CHAT_RETENTION_MINUTES = "10" # test wipes after 10 minutes so the wipe can be watched
PUBLIC_URL = "https://bot-test.disha-dira.com"

[[env.test.send_email]]
name = "EMAIL"

[env.live]
name = "dishadira-bot-live"

[[env.live.d1_databases]]
binding = "DB"
database_name = "dishadira-bot-live"
database_id = "fbda8944-e733-49c2-ac09-5d38e4dddab7"
migrations_dir = "migrations"

[env.live.triggers]
crons = ["*/2 * * * *"]

[env.live.observability]
enabled = true

[env.live.vars]
OWNER_APPROVED = "false"
NEW_BOOKINGS = "true" # step 2 of the launch order (Rohit, 29 Oct 2026): people can book and pay
SENDS = "true" # step 1 of the launch order (Rohit, 29 Oct 2026): the live bot can reply; bookings stay off
AI_REPLIES = "false"
CONSOLE_V2 = "false"
SOCIAL_REPLIES = "false" # ticket 32: "true" once Meta has approved the app (App Review, docs/SOCIAL.md); "false" stops every reply
PAYMENT_MODE = "live"
CHAT_RETENTION_MINUTES = "10080"
PUBLIC_URL = "https://bot.disha-dira.com"

[[env.live.send_email]]
name = "EMAIL"
