name: Deploy
# Manual only. Rohit starts it from the Actions tab and picks test or live.
# Runs the full checks, applies the D1 migrations to that environment's own database, then deploys that environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [test, live]
        default: test

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
      - run: npx wrangler deploy --dry-run --env ${{ inputs.environment }} --outdir dist
      - name: Apply D1 migrations (${{ inputs.environment }})
        run: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.environment }}
      - name: Deploy (${{ inputs.environment }})
        run: npx wrangler deploy --env ${{ inputs.environment }}
