# Ticket 60: builds the Disha Dira Tarot Android app (app/) as a test APK that Rohit can install on a phone. It only builds: it does not
# publish to Google Play, sign a release, or touch Cloudflare or Meta. Run it from Actions → Android app → Run workflow, or it runs when
# app/ changes. The APK opens the test game (bot-test.disha-dira.com/tarot); the "live" choice points it at the live game instead.
name: Android app
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which game the app opens
        type: choice
        options: [test, live]
        default: test
  push:
    paths: ["app/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Point the app at the chosen game
        if: ${{ inputs.target == 'live' }}
        working-directory: app
        run: sed -i 's#bot-test.disha-dira.com/tarot#bot.disha-dira.com/tarot#g' capacitor.config.json www/offline.html
      - run: npm ci
        working-directory: app
      - run: npx cap sync android
        working-directory: app
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: disha-dira-tarot-${{ inputs.target || 'test' }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
